<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic 3D Earth - Procedural Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .telemetry-overlay {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 245, 255, 0.85);
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            letter-spacing: 4px;
            pointer-events: none;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
            border-top: 1px solid rgba(0, 245, 255, 0.3);
            border-bottom: 1px solid rgba(0, 245, 255, 0.3);
            padding: 6px 20px;
        }
    </style>
</head>

<body>
    <div class="telemetry-overlay">ORBITAL TELEMETRY // PROCEDURAL RENDER ACTIVE</div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.8, 0.7, 0.1
        );
        composer.addPass(bloomPass);

        const ambientLight = new THREE.AmbientLight(0x111625, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 3.0);
        sunLight.position.set(6, 4, 5);
        scene.add(sunLight);

        // Starfield
        const starsGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(6000 * 3);
        for (let i = 0; i < 6000 * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 100;
            starPos[i + 1] = (Math.random() - 0.5) * 100;
            starPos[i + 2] = (Math.random() - 0.5) * 100;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.065, transparent: true, opacity: 0.9 });
        scene.add(new THREE.Points(starsGeo, starsMat));

        // Procedural Earth Shader (No external image textures needed!)
        const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
        const earthMaterial = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 } },
            vertexShader: `
                varying vec3 vNormal;
                varying vec2 vUv;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                varying vec2 vUv;
                uniform float uTime;

                // Simple pseudo-noise for procedural continents
                float rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }
                float noise(vec2 st) {
                    vec2 i = floor(st);
                    vec2 f = fract(st);
                    float a = rand(i);
                    float b = rand(i + vec2(1.0, 0.0));
                    float c = rand(i + vec2(0.0, 1.0));
                    float d = rand(i + vec2(1.0, 1.0));
                    vec2 u = f * f * (3.0 - 2.0 * f);
                    return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
                }

                void main() {
                    float n = noise(vUv * 8.0);
                    vec3 oceanColor = vec3(0.01, 0.08, 0.25);
                    vec3 landColor = vec3(0.08, 0.35, 0.15);
                    vec3 desertColor = vec3(0.35, 0.28, 0.15);
                    
                    vec3 col = mix(oceanColor, landColor, smoothstep(0.42, 0.46, n));
                    col = mix(col, desertColor, smoothstep(0.58, 0.68, n));

                    // Lighting
                    float light = max(dot(vNormal, normalize(vec3(1.0, 0.6, 0.8))), 0.15);
                    gl_FragColor = vec4(col * light, 1.0);
                }
            `
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        // Atmospheric Rim Glow
        const atmoGeometry = new THREE.SphereGeometry(1.04, 64, 64);
        const atmoMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.58 - dot(vNormal, vec3(0, 0, 1.0)), 2.2);
                    gl_FragColor = vec4(0.0, 0.78, 1.0, 1.0) * intensity * 3.0;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        scene.add(new THREE.Mesh(atmoGeometry, atmoMaterial));

        // Tilted Luminous Cyan Ring
        const ringGeo = new THREE.TorusGeometry(1.68, 0.026, 32, 128);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.75;
        ring.rotation.y = Math.PI / 4.8;
        scene.add(ring);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            earth.rotation.y = t * 0.055;
            ring.rotation.z = t * 0.032;
            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
