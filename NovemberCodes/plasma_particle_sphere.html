<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>AI Plasma Particle Sphere - 16:9 Cinema</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            overflow: hidden;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <!-- Three.js + UnrealBloom Post-Processing -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 3.35;

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Cinema Unreal Bloom Pass (Creates the exact blinding cyan/magenta glow)
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.65, // Bloom Strength
            0.75, // Radius
            0.08  // Threshold
        );
        composer.addPass(bloomPass);

        // 180,000 Ultra-Fine Micro Particles
        const COUNT = 180000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(COUNT * 3);
        const randoms = new Float32Array(COUNT * 3);

        for (let i = 0; i < COUNT; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = 2.0 * Math.PI * u;
            const phi = Math.acos(2.0 * v - 1.0);

            positions[i * 3] = Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = Math.cos(phi);

            randoms[i * 3] = Math.random();
            randoms[i * 3 + 1] = Math.random();
            randoms[i * 3 + 2] = Math.random();
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));

        const material = new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            uniforms: {
                uTime: { value: 0 },
                uMouse: { value: new THREE.Vector2(0, 0) },
                uExplode: { value: 1.5 } // First 2s shockwave hook
            },
            vertexShader: `
        uniform float uTime;
        uniform vec2 uMouse;
        uniform float uExplode;
        attribute vec3 aRandom;
        varying vec3 vColor;
        varying float vAlpha;

        // 3D Simplex Noise for Silk Plasma Folding
        vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
        vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
        float snoise(vec3 v){
          const vec2 C = vec2(1.0/6.0, 1.0/3.0);
          const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
          vec3 i  = floor(v + dot(v, C.yyy));
          vec3 x0 = v - i + dot(i, C.xxx);
          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min(g.xyz, l.zxy);
          vec3 i2 = max(g.xyz, l.zxy);
          vec3 x1 = x0 - i1 + 1.0 * C.xxx;
          vec3 x2 = x0 - i2 + 2.0 * C.xxx;
          vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
          i = mod(i, 289.0);
          vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                  + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                  + i.x + vec4(0.0, i1.x, i2.x, 1.0));
          float n_ = 1.0/7.0;
          vec3 ns = n_ * D.wyz - D.xzx;
          vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_);
          vec4 x = x_ *ns.x + ns.yyyy;
          vec4 y = y_ *ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(x) - abs(y);
          vec4 b0 = vec4(x.xy, y.xy);
          vec4 b1 = vec4(x.zw, y.zw);
          vec4 s0 = floor(b0)*2.0 + 1.0;
          vec4 s1 = floor(b1)*2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));
          vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
          vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
          vec3 p0 = vec3(a0.xy,h.x);
          vec3 p1 = vec3(a0.zw,h.y);
          vec3 p2 = vec3(a1.xy,h.z);
          vec3 p3 = vec3(a1.zw,h.w);
          vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
          p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
          vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
          m = m * m;
          return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        void main() {
          vec3 pos = position;
          float t = uTime * 0.28;

          // Multi-layered 3D Curl/Warp Displacement (Creates the folded silk ribbons)
          float n1 = snoise(pos * 1.45 + vec3(t, -t * 0.8, t * 0.5));
          float n2 = snoise(pos * 2.8 - vec3(t * 0.7, t, -t * 0.6) + n1 * 0.65);
          float n3 = snoise(pos * 1.9 + vec3(-t * 0.5, t * 0.6, t));

          vec3 warp = vec3(n1, n2, n3) * 0.26;
          vec3 warpedPos = normalize(pos + warp);

          // Outer wispy ejections (top-right & bottom flares)
          float wisp = step(0.88, aRandom.x) * pow(max(0.0, n1 + 0.35), 2.0) * 0.28;
          float radius = 1.0 + n2 * 0.055 + wisp + uExplode * (0.4 + aRandom.y * 1.2);

          vec3 finalPos = warpedPos * radius;

          // Mouse Wave Interaction
          float mDist = length(finalPos.xy - uMouse * 1.2);
          float mWave = smoothstep(0.65, 0.0, mDist);
          finalPos += normalize(finalPos) * sin(mDist * 12.0 - uTime * 8.0) * mWave * 0.09;

          vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          // Sub-pixel dust size
          gl_PointSize = (1.65 + aRandom.z * 1.2 + mWave * 2.0) * (2.6 / -mvPosition.z);

          // Color Palette: Deep Cobalt -> Electric Cyan Caustics -> Magenta/Gold Bottom Flare
          vec3 deepBlue   = vec3(0.03, 0.22, 0.95);
          vec3 brightCyan = vec3(0.0, 0.95, 1.0);
          vec3 magenta    = vec3(0.95, 0.08, 0.55);
          vec3 warmGold   = vec3(1.0, 0.65, 0.2);

          float caustic = smoothstep(-0.2, 0.75, n2);
          float rim = pow(1.0 - abs(dot(normalize(mvPosition.xyz), warpedPos)), 2.2);
          float bottomGlow = pow(clamp((-finalPos.y - 0.25) / 0.75, 0.0, 1.0), 2.2);
          float purpleVein = smoothstep(0.2, 0.85, n3);

          vec3 col = mix(deepBlue, brightCyan, caustic * 0.85 + rim * 0.6);
          col = mix(col, magenta, purpleVein * 0.45 + bottomGlow * 0.75);
          col += warmGold * pow(bottomGlow, 2.5) * 1.4;

          vColor = col;
          vAlpha = (0.14 + caustic * 0.28 + rim * 0.45) * (1.0 - wisp * 1.6);
        }
      `,
            fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - vec2(0.5));
          if (d > 0.5) discard;
          float strength = pow(1.0 - d * 2.0, 1.8);
          gl_FragColor = vec4(vColor, strength * vAlpha);
        }
      `
        });

        const spherePoints = new THREE.Points(geometry, material);
        scene.add(spherePoints);

        // Dark inner core sphere so back-particles look softly occluded like the photo
        const coreMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.94, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0x010208, transparent: true, opacity: 0.72 })
        );
        scene.add(coreMesh);

        window.addEventListener('mousemove', (e) => {
            material.uniforms.uMouse.value.x = (e.clientX / window.innerWidth) * 2 - 1;
            material.uniforms.uMouse.value.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('click', () => {
            material.uniforms.uExplode.value = 1.35;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            material.uniforms.uTime.value = elapsed;
            material.uniforms.uExplode.value *= 0.92; // Smooth initial reformation

            spherePoints.rotation.y = elapsed * 0.18;
            spherePoints.rotation.z = Math.sin(elapsed * 0.15) * 0.12;

            composer.render();
        }
        animate();
    </script>
</body>

</html>
